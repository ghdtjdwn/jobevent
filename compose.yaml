x-jobevent: &app
  image: jobevent:local
  build: .
  env_file: .env
  environment:
    JOBEVENT_TRUST_PROXY: "1"
  volumes:
    - appdata:/var/lib/jobevent
  restart: unless-stopped
  init: true
  security_opt:
    - no-new-privileges:true
services:
  migrate:
    <<: *app
    command: ["django-admin", "migrate", "--noinput"]
    restart: "no"
  web:
    <<: *app
    depends_on:
      migrate:
        condition: service_completed_successfully
  worker:
    <<: *app
    command: ["django-admin", "runworker"]
    depends_on:
      migrate:
        condition: service_completed_successfully
  proxy:
    image: caddy:2-alpine
    restart: unless-stopped
    environment:
      JOBEVENT_DOMAIN: ${JOBEVENT_DOMAIN:?도메인을 설정하세요}
    ports: ["80:80", "443:443"]
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddydata:/data
      - caddyconfig:/config
    depends_on: [web]
volumes:
  appdata:
  caddydata:
  caddyconfig:
