name: Production delivery
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
permissions:
  contents: read
jobs:
  verify:
    if: github.event.workflow_run.event == 'push' && github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 14
    steps:
      - name: Verify the production revision, without deployment credentials
        env:
          TARGET: ${{ github.event.workflow_run.head_sha }}
          GH_TOKEN: ${{ github.token }}
        run: |
          for i in {1..70}; do
            current=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq .object.sha)
            if [ "$current" != "$TARGET" ]; then echo "Superseded by a newer main commit."; exit 0; fi
            if curl -fsS --max-time 5 https://jobevent.ssumcp.duckdns.org/healthz | jq -e --arg target "$TARGET" '.status=="ok" and .revision==$target' >/dev/null; then
              echo "Verified production: $TARGET"; exit 0
            fi
            sleep 10
          done
          echo "Production did not report the expected revision."; exit 1
