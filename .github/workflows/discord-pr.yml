name: Discord PR
on:
  pull_request:
    types: [opened, ready_for_review]
permissions: {}
jobs:
  notify:
    name: notify discord
    # Draft PR은 열 때 건너뛰고 Ready for review로 바꿀 때 알린다.
    if: github.event.action == 'ready_for_review' || !github.event.pull_request.draft
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Send review request
        env:
          WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_URL: ${{ github.event.pull_request.html_url }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
          HEAD_BRANCH: ${{ github.event.pull_request.head.ref }}
          ADDITIONS: ${{ github.event.pull_request.additions }}
          DELETIONS: ${{ github.event.pull_request.deletions }}
        # fork PR과 Dependabot PR에는 저장소 secret이 전달되지 않아 알림 없이 끝난다.
        run: |
          if [ -z "$WEBHOOK_URL" ]; then echo "DISCORD_WEBHOOK_URL secret이 없어 알림을 건너뜁니다."; exit 0; fi
          payload=$(jq -n \
            --arg title "$PR_TITLE" --arg url "$PR_URL" --arg author "$PR_AUTHOR" \
            --arg head "$HEAD_BRANCH" --arg additions "$ADDITIONS" --arg deletions "$DELETIONS" \
            '($title | sub("^[A-Za-z]+(\\([^)]*\\))?!?:\\s*"; "")) as $summary
            | {
                username: "jobevent PR",
                content: "🔔 **\($summary)** 리뷰 요청드립니다.\n> `main` ⬅️ `\($head)` · 👤 `\($author)` · `+\($additions) / -\($deletions)`\n\($url)",
                allowed_mentions: {parse: []}
              }')
          curl -sS --fail-with-body -X POST -H "Content-Type: application/json" -d "$payload" "$WEBHOOK_URL"
