name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '17 23 * * 0'
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}-${{ github.event_name }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d
        with:
          version: "0.11.25"
      - run: uv sync --locked --python ${{ matrix.python }}
      - run: uv run ruff check . && uv run ruff format --check .
      - run: node --check jobevent/static/app.js
      - run: uv run pytest -q
      - name: Browser workflow (isolated account, no external AI or webhook)
        if: matrix.python == '3.12'
        run: uv run --with playwright==1.65.2 python checks/browser.py
      - run: uv build
  container:
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d
        with:
          version: "0.11.25"
      - run: bash -n deploy/cd/pull-release.sh && docker build -t jobevent:ci .
      - name: Audit exact third-party Python packages in the ARM64 release image
        run: |
          docker run --rm jobevent:ci python -c 'from importlib.metadata import distributions; print("\n".join(sorted({d.metadata["Name"]+"=="+d.version for d in distributions() if d.metadata["Name"].lower()!="jobevent"})))' > "$RUNNER_TEMP/runtime.txt"
          grep -Eiq '^cryptography==' "$RUNNER_TEMP/runtime.txt"
          grep -Eiq '^filelock==' "$RUNNER_TEMP/runtime.txt"
          grep -Eiq '^django==' "$RUNNER_TEMP/runtime.txt"
          uvx pip-audit==2.10.1 --disable-pip --no-deps --strict -r "$RUNNER_TEMP/runtime.txt"
      - name: Check production configuration and worker
        run: |
          python3 deploy/configure.py example.org
          docker run --rm --env-file .env jobevent:ci sh -ec 'django-admin migrate --noinput && django-admin check --deploy --fail-level ERROR && django-admin runworker --once'
