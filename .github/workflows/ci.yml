name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '17 23 * * 0'
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}-${{ github.event_name }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d
        with:
          version: "0.11.25"
      - run: uv sync --locked --python ${{ matrix.python }}
      - run: uv run ruff check . && uv run ruff format --check .
      - run: node --check jobevent/static/app.js
      - run: uv run pytest -q
      - name: Browser workflow (temporary local data, no external AI or webhook)
        if: matrix.python == '3.12'
        run: uv run --with playwright==1.65.2 python checks/browser.py
      - name: Audit locked runtime packages for known vulnerabilities
        if: matrix.python == '3.12'
        run: |
          uv export --locked --no-dev --no-emit-project --no-hashes -o "$RUNNER_TEMP/runtime.txt"
          uvx pip-audit==2.10.1 --disable-pip --no-deps --strict -r "$RUNNER_TEMP/runtime.txt"
      - run: uv build
