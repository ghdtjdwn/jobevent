version: 2
updates:
  - package-ecosystem: uv
    directory: /
    schedule: {interval: weekly}
    commit-message: {prefix: chore}
    open-pull-requests-limit: 2
    groups:
      python-minor: {update-types: [minor, patch]}
  - package-ecosystem: github-actions
    directory: /
    schedule: {interval: monthly}
    commit-message: {prefix: chore}
