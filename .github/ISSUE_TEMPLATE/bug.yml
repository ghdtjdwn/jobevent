name: 버그
description: '발생한 문제와 재현 정보를 등록합니다. 제목은 `fix: 대상과 바꿀 내용` 형식으로 50자 이하로 씁니다.'
title: 'fix: '
labels: [bug]
body:
  - type: markdown
    attributes:
      value: 실제 API 키, 웹훅 URL, 이력서, 계정 정보, 운영 로그 원문은 첨부하지 마세요. 보안 문제는 [비공개 보안 신고](https://github.com/ghdtjdwn/jobevent/security/advisories/new)를 이용하세요.
  - type: textarea
    id: description
    attributes:
      label: 현상
      description: 사용자나 시스템이 겪는 문제를 2문장 이하로 씁니다.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: 재현 방법
      description: 문제를 다시 일으키는 단계를 번호 목록으로 씁니다. 재현 조건을 모르면 `재현 조건을 확인하지 못했습니다.`와 확인한 발생 상황을 씁니다.
      value: |
        1.
    validations:
      required: true
  - type: textarea
    id: expected-actual
    attributes:
      label: 기대 동작과 실제 동작
      description: 같은 입력에 대해 `# As-is`에 실제 동작을, `# To-be`에 기대 동작을 씁니다.
      value: |
        ```text
        # <사례 이름>
        <입력이나 요청>

        # As-is
        <실제 동작>
        # To-be
        <기대 동작>
        ```
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: 발생 환경
      description: 공개 서비스/로컬 개발 서버/로컬 단일 사용자 모드, 커밋 SHA, 브라우저와 기기처럼 확인한 정보를 목록으로 씁니다.
    validations:
      required: false
  - type: textarea
    id: attachments
    attributes:
      label: 스크린샷과 로그
      description: 문제 확인에 필요한 자료를 첨부합니다. 개인정보, 키, 웹훅 URL과 비밀값은 지웁니다.
    validations:
      required: false
