[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "jobevent"
version = "0.2.0"
description = "Private, bring-your-own-key opportunity alerts"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
dependencies = [
    "filelock>=4.2.1,<5",
    "keyring>=25,<26",
    "pypdf>=6,<8",
    "tzdata>=2025.1",
]

[project.scripts]
jobevent = "jobevent.app:main"

[tool.setuptools.package-data]
jobevent = ["static/*"]

[tool.setuptools.packages.find]
include = ["jobevent*"]

[dependency-groups]
dev = ["ruff>=0.11,<1", "pytest>=8,<10", "build>=1,<2"]

[tool.ruff]
target-version = "py311"
[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
